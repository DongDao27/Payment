name: E2E
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e_root_only
          MYSQL_DATABASE: thu_thanh_test
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -pe2e_root_only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      E2E_TESTING: '1'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: thu_thanh_test
      DB_USERNAME: e2e
      DB_PASSWORD: e2e_only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, dom, fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: |
          cp backend/.env.testing.example backend/.env.testing
          cd backend
          php artisan key:generate --env=testing
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            output/e2e/
            .runtime/e2e-server.log
          retention-days: 7

worker_processes auto;
worker_rlimit_nofile 65536;
events { worker_connections 16384; multi_accept on; }
http {
    include /etc/nginx/mime.types;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    keepalive_requests 1000;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    log_format safe '$remote_addr $request_method $uri $status $request_time $upstream_cache_status';
    access_log /var/log/nginx/access.log safe;
    proxy_cache_path /var/cache/nginx/catalog levels=1:2 keys_zone=catalog:32m max_size=1g inactive=60s use_temp_path=off;
    map $http_cookie $has_cookie { default 1; "" 0; }
    upstream frontend { server frontend:3000 resolve; zone frontend 64k; keepalive 64; }
    upstream api { server web:80 resolve; zone api 64k; keepalive 64; }
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 80;
        server_name _;
        client_max_body_size 6m;
        add_header X-Content-Type-Options nosniff always;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;

        # Only the explicitly anonymous, cookie-free public snapshot is cached.
        location = /api/v1/storefront {
            proxy_pass http://api;
            proxy_cache catalog;
            proxy_cache_key "$scheme|$host|$request_uri";
            proxy_cache_methods GET HEAD;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_valid 200 20s;
            proxy_cache_bypass $http_authorization $has_cookie;
            proxy_no_cache $http_authorization $has_cookie $upstream_http_set_cookie;
            add_header X-Cache-Status $upstream_cache_status always;
        }
        location ~ ^/(api/|sanctum/|storage/) {
            proxy_pass http://api;
            proxy_cache off;
            add_header Cache-Control "private, no-store" always;
        }
        location / {
            proxy_pass http://frontend;
            proxy_cache off;
            proxy_buffering off;
        }
    }
}
